name: Build and release FAP

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag starting with v (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build FAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" != v?* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release tag must be a valid Git tag starting with v."
            exit 1
          fi
          REMOTE_TAG=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [[ -z "$REMOTE_TAG" ]]; then
            REMOTE_TAG=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          if [[ -n "$REMOTE_TAG" && "$REMOTE_TAG" != "$GITHUB_SHA" ]]; then
            echo "::error::Manual releases cannot reuse a tag pointing to a different commit."
            exit 1
          fi

      - name: Build for Momentum firmware
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
          sdk-channel: release

      - name: Upload FAP artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfkeys-decrypt-fap
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error

      - name: Show artifact download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '## FAP download\n\n[Download mfkeys-decrypt-fap](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download FAP artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: mfkeys-decrypt-fap
          path: dist

      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG_REF="refs/tags/$RELEASE_TAG"
          remote_tag_commit() {
            local tag_ref="$1"
            local remote_tag
            remote_tag=$(git ls-remote origin "$tag_ref^{}" | awk 'NR == 1 { print $1 }')
            if [[ -z "$remote_tag" ]]; then
              remote_tag=$(git ls-remote --refs origin "$tag_ref" | awk 'NR == 1 { print $1 }')
            fi
            printf '%s' "$remote_tag"
          }

          EXISTING_TAG=$(remote_tag_commit "$TAG_REF")
          if [[ -n "$EXISTING_TAG" ]]; then
            if [[ "$EXISTING_TAG" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag already points to a different commit."
              exit 1
            fi
          elif ! git push origin "$GITHUB_SHA:$TAG_REF"; then
            EXISTING_TAG=$(remote_tag_commit "$TAG_REF")
            if [[ "$EXISTING_TAG" != "$GITHUB_SHA" ]]; then
              echo "::error::Could not create release tag; it points to a different commit or could not be verified."
              exit 1
            fi
          fi

          VERIFIED_TAG=$(remote_tag_commit "$TAG_REF")
          if [[ "$VERIFIED_TAG" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag does not point to this build's commit."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.fap
          fail_on_unmatched_files: true
