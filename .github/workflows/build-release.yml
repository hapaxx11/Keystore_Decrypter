name: Build and release FAP

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for Momentum firmware
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
          sdk-channel: release

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfkeys-decrypt-fap
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download FAP artifact
        uses: actions/download-artifact@v4
        with:
          name: mfkeys-decrypt-fap
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.fap
          fail_on_unmatched_files: true
